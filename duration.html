<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>@ptrrdrck // duration</title>
    <link href="./style.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <p class="fade-in">time duration calculator</p>
    </header>
    <div id="format-toggle" class="fade-in">
      <select id="timezone-select" class="format-btn tz-select" aria-label="time zone"></select>
      <button type="button" class="format-btn active" data-format="24">24h</button>
      <button type="button" class="format-btn" data-format="12">12h</button>
    </div>
    <section id="duration-widget" class="about fade-in">
      <div class="duration-row">
        <label>start</label>
        <div class="time-entry" data-field="start">
          <input type="number" class="hour-input" min="0" max="23" placeholder="HH" aria-label="start hour" />
          <span>:</span>
          <input type="number" class="minute-input" min="0" max="59" placeholder="MM" aria-label="start minute" />
          <select class="period-select" hidden aria-label="start AM/PM">
            <option value="AM">AM</option>
            <option value="PM">PM</option>
          </select>
        </div>
        <a href="#" id="now-link" class="now-link">now</a>
      </div>
      <div class="duration-row">
        <label>end</label>
        <div class="time-entry" data-field="end">
          <input type="number" class="hour-input" min="0" max="23" placeholder="HH" aria-label="end hour" />
          <span>:</span>
          <input type="number" class="minute-input" min="0" max="59" placeholder="MM" aria-label="end minute" />
          <select class="period-select" hidden aria-label="end AM/PM">
            <option value="AM">AM</option>
            <option value="PM">PM</option>
          </select>
        </div>
      </div>
      <div id="duration-result">&mdash;</div>
    </section>
    <footer>
      <a class="button" href="https://ptrrdrck.github.io/"
        >back<span class="emoji">&#128072;</span></a
      >
    </footer>
    <script>
      let format = "24"; // "24" or "12"
      const state = {
        start: { hour24: null, minute: null },
        end: { hour24: null, minute: null },
      };

      const formatButtons = document.querySelectorAll(".format-btn");
      const fields = document.querySelectorAll(".time-entry");
      const result = document.getElementById("duration-result");

      function to12Hour(hour24) {
        const period = hour24 >= 12 ? "PM" : "AM";
        const hour = hour24 % 12 || 12;
        return { hour, period };
      }

      function to24Hour(hour12, period) {
        let hour24 = hour12 % 12;
        if (period === "PM") hour24 += 12;
        return hour24;
      }

      function renderField(fieldEl, key) {
        const hourInput = fieldEl.querySelector(".hour-input");
        const minuteInput = fieldEl.querySelector(".minute-input");
        const periodSelect = fieldEl.querySelector(".period-select");
        const { hour24, minute } = state[key];

        periodSelect.hidden = format === "24";

        if (hour24 === null) {
          hourInput.value = "";
          periodSelect.value = "AM";
        } else if (format === "24") {
          hourInput.min = 0;
          hourInput.max = 23;
          hourInput.value = hour24;
        } else {
          hourInput.min = 1;
          hourInput.max = 12;
          const { hour, period } = to12Hour(hour24);
          hourInput.value = hour;
          periodSelect.value = period;
        }

        minuteInput.value = minute === null ? "" : String(minute).padStart(2, "0");
      }

      function readField(fieldEl, key) {
        const hourInput = fieldEl.querySelector(".hour-input");
        const minuteInput = fieldEl.querySelector(".minute-input");
        const periodSelect = fieldEl.querySelector(".period-select");

        if (hourInput.value === "" || minuteInput.value === "") {
          state[key].hour24 = null;
          state[key].minute = null;
          return;
        }

        let hour = Number(hourInput.value);
        const minute = Math.min(59, Math.max(0, Number(minuteInput.value)));

        if (format === "24") {
          hour = Math.min(23, Math.max(0, hour));
          state[key].hour24 = hour;
        } else {
          hour = Math.min(12, Math.max(1, hour));
          state[key].hour24 = to24Hour(hour, periodSelect.value);
        }
        state[key].minute = minute;
      }

      function toMinutes({ hour24, minute }) {
        if (hour24 === null || minute === null) return null;
        return hour24 * 60 + minute;
      }

      function calculateDuration() {
        const start = toMinutes(state.start);
        const end = toMinutes(state.end);

        if (start === null || end === null) {
          result.textContent = "—";
          return;
        }

        let diff = end - start;
        let overnight = false;
        if (diff < 0) {
          diff += 24 * 60;
          overnight = true;
        }

        const hours = Math.floor(diff / 60);
        const minutes = diff % 60;
        const label = `${hours}h ${minutes}m${overnight ? " (next day)" : ""}`;
        result.textContent = diff === 0 ? "0h 0m" : label;
      }

      fields.forEach((fieldEl) => {
        const key = fieldEl.dataset.field;
        fieldEl.querySelectorAll("input, select").forEach((el) => {
          el.addEventListener("input", () => {
            readField(fieldEl, key);
            calculateDuration();
          });
          el.addEventListener("change", () => {
            readField(fieldEl, key);
            renderField(fieldEl, key);
            calculateDuration();
          });
        });
      });

      const nowLink = document.getElementById("now-link");
      const startFieldEl = document.querySelector('.time-entry[data-field="start"]');
      const tzSelect = document.getElementById("timezone-select");

      function formatOffset(offsetMinutes) {
        const sign = offsetMinutes < 0 ? "-" : "+";
        const abs = Math.abs(offsetMinutes);
        const hours = Math.floor(abs / 60);
        const minutes = abs % 60;
        return `GMT${sign}${hours}${minutes ? ":" + String(minutes).padStart(2, "0") : ""}`;
      }

      function getTimeAtOffset(offsetMinutes) {
        const now = new Date();
        const utcMinutes = now.getUTCHours() * 60 + now.getUTCMinutes();
        const total = (((utcMinutes + offsetMinutes) % 1440) + 1440) % 1440;
        return { hour24: Math.floor(total / 60), minute: total % 60 };
      }

      function fillStartWithNow() {
        const { hour24, minute } = getTimeAtOffset(Number(tzSelect.value));
        state.start.hour24 = hour24;
        state.start.minute = minute;
        renderField(startFieldEl, "start");
        calculateDuration();
      }

      // Real-world GMT offsets currently in use, derived from the IANA
      // database when available so oddities like GMT+5:45 are included.
      const detectedOffset = -new Date().getTimezoneOffset();
      const fallbackOffsets = [
        -720, -660, -600, -570, -540, -480, -420, -360, -300, -270, -240,
        -210, -180, -150, -120, -60, 0, 60, 120, 180, 210, 240, 270, 300,
        330, 345, 360, 390, 420, 480, 525, 540, 570, 600, 630, 660, 690,
        720, 765, 780, 840,
      ];
      const offsets =
        typeof Intl.supportedValuesOf === "function"
          ? Intl.supportedValuesOf("timeZone").map((zone) => {
              const parts = new Intl.DateTimeFormat("en-US", {
                timeZone: zone,
                timeZoneName: "shortOffset",
              }).formatToParts();
              const [, sign, h, m] = parts
                .find((p) => p.type === "timeZoneName")
                .value.match(/GMT([+-])(\d+)(?::(\d+))?/);
              return (sign === "-" ? -1 : 1) * (Number(h) * 60 + Number(m || 0));
            })
          : fallbackOffsets;

      const uniqueOffsets = Array.from(new Set([...offsets, detectedOffset])).sort(
        (a, b) => a - b
      );

      uniqueOffsets.forEach((offset) => {
        const option = document.createElement("option");
        option.value = offset;
        option.textContent = formatOffset(offset);
        tzSelect.appendChild(option);
      });
      tzSelect.value = detectedOffset;

      nowLink.addEventListener("click", (e) => {
        e.preventDefault();
        fillStartWithNow();
      });

      tzSelect.addEventListener("change", fillStartWithNow);

      formatButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          if (btn.dataset.format === format) return;
          format = btn.dataset.format;
          formatButtons.forEach((b) => b.classList.toggle("active", b === btn));
          fields.forEach((fieldEl) => renderField(fieldEl, fieldEl.dataset.field));
        });
      });
    </script>
  </body>
</html>
